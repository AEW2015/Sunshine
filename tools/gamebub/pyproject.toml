[project]
name = "gamebub-host-lab"
version = "0.1.0"
description = "Offline Game Bub Windows capture and JPEG conformance laboratory"
requires-python = ">=3.11,<3.15"
dependencies = ["pillow>=10.2", "av>=16"]

[dependency-groups]
dev = ["coverage>=7", "ruff>=0.14"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
branch = true
source = ["host", "make_assets", "realtime", "seed_pairing", "msv1", "pipeline", "stream_sender", "controller", "quality"]

[tool.coverage.report]
show_missing = true
